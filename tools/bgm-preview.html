<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGM 試聽</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, "Microsoft JhengHei", sans-serif; background: #1b1530; color: #eee; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .note { font-size: 12px; color: #aaa; margin: 0 0 16px; line-height: 1.6; }
  .track { background: #2a2245; border: 1px solid #3d3363; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .track.on { border-color: #ffb347; box-shadow: 0 0 0 1px #ffb347 inset; }
  .track h2 { font-size: 16px; margin: 0 0 2px; }
  .track p { font-size: 12px; color: #bbb; margin: 0 0 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-size: 13px; border-radius: 8px; border: 1px solid #5a4d8c; background: #3a3060; color: #fff; padding: 6px 12px; cursor: pointer; }
  button.play { background: #e07b2a; border-color: #ffb347; }
  .vol { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; font-size: 13px; }
  .vol input { flex: 1; }
  .bar { height: 4px; background: #3d3363; border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #ffb347; }
</style>
</head>
<body>
<main>
  <h1>🎵 天空裂洞物語 BGM 試聽</h1>
  <p class="note">全部由程式即時合成的原創 8-bit 曲子，沒有用任何外部素材 → 版權是你的，商用不用標註。<br>
  每首都是無縫循環。「下載 WAV」會輸出兩輪循環的音檔（可拿去剪輯／其他用途）。</p>
  <div class="vol">🔊 <input id="vol" type="range" min="0" max="100" value="60"></div>
  <div id="list"></div>
</main>
<script>window.G = window.G || {};</script>
<script src="../js/bgm.js"></script>
<script>
const { SONGS, prepare, bus, scheduleStep, render, wav } = G.BGM;

// ── 播放器 ─────────────────────────────────────────────────────────────
let ctx = null, out = null, cur = null;
function stop() {
  if (!cur) return;
  clearInterval(cur.timer); cancelAnimationFrame(cur.raf);
  const m = cur.b.master; m.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
  setTimeout(() => m.disconnect(), 400);
  document.querySelectorAll('.track').forEach(el => el.classList.remove('on'));
  document.querySelectorAll('.play').forEach(el => el.textContent = '▶ 播放');
  cur = null;
}
function play(song) {
  if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); out = ctx.createGain(); out.connect(ctx.destination); setVol(); }
  ctx.resume();
  const was = cur && cur.song === song; stop(); if (was) return;
  const comp = prepare(song), b = bus(ctx, out, song);
  const t0 = ctx.currentTime + 0.08;
  cur = { song, b, step: 0, next: t0, t0 };
  cur.timer = setInterval(() => {
    while (cur && cur.next < ctx.currentTime + 0.15) {
      scheduleStep(ctx, b, song, comp, cur.step % comp.steps, cur.next);
      cur.step++; cur.next += b.stepDur;
    }
  }, 25);
  const el = document.getElementById('t-' + song.id), bar = el.querySelector('.bar i');
  el.classList.add('on'); el.querySelector('.play').textContent = '■ 停止';
  const tick = () => { if (!cur || cur.song !== song) { bar.style.width = 0; return; }
    const p = ((ctx.currentTime - t0) / (b.stepDur * comp.steps)) % 1; bar.style.width = Math.max(0, p) * 100 + '%'; cur.raf = requestAnimationFrame(tick); };
  tick();
}
function setVol() { if (out) out.gain.value = Math.pow(document.getElementById('vol').value / 100, 1.5); }
document.getElementById('vol').oninput = setVol;

async function download(song, btn) {
  btn.disabled = true; btn.textContent = '產生中…';
  const blob = wav(await render(song));
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bgm_${song.id}.wav`; a.click();
  btn.disabled = false; btn.textContent = '⬇ 下載 WAV';
}

document.getElementById('list').innerHTML = SONGS.map(s => `
  <div class="track" id="t-${s.id}">
    <h2>${s.name}</h2><p>${s.desc}</p>
    <div class="row"><button class="play" data-id="${s.id}">▶ 播放</button><button class="dl" data-id="${s.id}">⬇ 下載 WAV</button></div>
    <div class="bar"><i></i></div>
  </div>`).join('');
document.getElementById('list').onclick = e => {
  const btn = e.target.closest('button'); if (!btn) return;
  const s = SONGS.find(x => x.id === btn.dataset.id);
  btn.classList.contains('play') ? play(s) : download(s, btn);
};
window.BGM = G.BGM;
</script>
</body>
</html>

<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>天空裂洞物語</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left">
      <div class="lv"><span id="hudName" class="hud-name"></span>Lv <b id="hudLv">1</b> <span id="hudCls"></span></div>
      <div class="xpbar"><i id="hudXp"></i></div>
    </div>
    <div class="hud-right">
      <span>💰 <b id="hudGold">0</b></span>
      <span>💎 <b id="hudCrystal">0</b></span>
    </div>
    <button id="settingsBtn" data-act="settings" aria-label="Settings">⚙️</button>
  </header>

  <section id="battleWrap">
    <!-- 可折疊的戰鬥區：收起時 Phaser 仍在背景跑，只是把高度收成 0 -->
    <div id="battleBox">
      <div id="battle"></div>
      <div id="buffBar"></div>
      <div id="revive" hidden>
        <div class="revive-card">
          <div class="revive-title" id="reviveTitle"></div>
          <div id="reviveText"></div>
          <button class="btn primary" id="revivePay" data-act="revivePay"></button>
        </div>
      </div>
    </div>
    <div id="floorBar">
      <span id="floorName"></span>
      <div class="prog"><i id="floorProg"></i></div>
      <span id="floorKills">0/10</span>
      <button id="collapseBtn" data-act="collapse" aria-label="toggle battle view">▲</button>
    </div>
  </section>

  <main id="panel"></main>

  <nav id="tabs">
    <button data-tab="adventure" class="on"><span>🗺️</span><em data-i18n="tab.adventure"></em></button>
    <button data-tab="hero"><span>🧍</span><em data-i18n="tab.hero"></em></button>
    <button data-tab="skills"><span>📜</span><em data-i18n="tab.skills"></em></button>
    <button data-tab="partners"><span>🤝</span><em data-i18n="tab.partners"></em></button>
    <button data-tab="ship"><span>🎈</span><em data-i18n="tab.ship"></em></button>
    <button data-tab="home"><span>🏠</span><em data-i18n="tab.home"></em></button>
  </nav>

  <div id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
  <div id="toast"></div>
</div>

<script src="vendor/phaser.min.js"></script>
<script src="assets/manifest.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="lang/zh-TW.js"></script>
<script src="lang/en.js"></script>
<script src="lang/zh-CN.js"></script>
<script src="js/state.js"></script>
<script src="js/art.js"></script>
<script src="js/battle.js"></script>
<script src="js/net.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
